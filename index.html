<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>
<style>
   body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }

  /* Contenedor del título e ID en la misma fila */
  .titulo-fila {
    display: flex;
    align-items: center; /* Alinea verticalmente */
    gap: 20px;           /* Espacio entre título y ID */
    margin-bottom: 20px;
  }

  /* ID en la misma línea con su input */
  .id-bloque {
    display: flex;
    align-items: center;
    gap: 5px; /* Espacio entre etiqueta e input */
  }

  label {
    font-weight: bold;
  }

  input[type="text"],
  input[type="number"] {
    padding: 5px;
    font-size: 14px;
    box-sizing: border-box;
  }

  /* Tamaños específicos */
  #txtID {
    width: 80px;
  }

  /* Fila de campos */
  .fila {
    display: flex;
    gap: 20px;
    margin-bottom: 10px;
  }

  .bloque {
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  /* Botón */
  .boton {
    margin-top: 10px;
  }
</style>
</head>
<body>

<!-- Título e ID en la misma fila -->
<div class="titulo-fila">
  <h1>Registro de usuario</h1>
  <div class="id-bloque">
    <label for="txtID">ID:</label>
    <input type="number" id="txtID" value="1">
  </div>
</div>

<form>
  <!-- Fila Nombre y Apellido -->
  <div class="fila">
    <div class="bloque">
      <label for="txtNombre">Nombre:</label>
      <input type="text" id="txtNombre">
    </div>
    <div class="bloque">
      <label for="txtApellido">Apellido:</label>
      <input type="text" id="txtApellido">
    </div>
  </div>

  <!-- Fila Nombre de usuario y Contraseña -->
  <div class="fila">
    <div class="bloque">
      <label for="txtUsuario">Nombre de usuario:</label>
      <input type="text" id="txtUsuario">
    </div>
    <div class="bloque">
      <label for="txtContrasena">Contraseña:</label>
      <input type="text" id="txtContrasena">
    </div>
  </div>

  <!-- Botón -->
  <div class="boton">
    <input type="button" value="Registrar" id="btnRegistrar">
  </div>
</form>

<p id="pResultado"></p>

<script src="libreria.js"></script>
    <script src="codigo.js"></script>
</body>
</html>
